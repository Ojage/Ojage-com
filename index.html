<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Primary Meta Tags -->
    <title>OJAGE | Engineering the Future</title>
    <meta name="title" content="OJAGE | Engineering the Future" />
    <meta name="description" content="A digital ecosystem for AI innovation, personal growth, and purposeful family legacy. Explore Salathiel Ojage's portfolio and AI/ML projects." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ojage.com/" />
    <meta property="og:title" content="OJAGE | Engineering the Future" />
    <meta property="og:description" content="Explore personal and AI/ML projects under the OJAGE umbrella. Built to empower innovation and legacy." />
    <meta property="og:image" content="https://ojage.com/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://ojage.com/" />
    <meta property="twitter:title" content="OJAGE | Engineering the Future" />
    <meta property="twitter:description" content="Explore personal and AI/ML projects under the OJAGE umbrella. Built to empower innovation and legacy." />
    <meta property="twitter:image" content="https://ojage.com/og-image.jpg" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />

    <!-- Fonts and Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS -->
    <link href="/dist/output.css" rel="stylesheet" />

    <!-- Canonical Link -->
    <link rel="canonical" href="https://ojage.com/" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "OJAGE",
        "url": "https://ojage.com",
        "author": {
          "@type": "Person",
          "name": "Salathiel Ojage"
        },
        "description": "A digital platform for AI/ML engineering, personal branding, and legacy building.",
        "inLanguage": "en"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
