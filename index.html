<!doctype html>
<html lang="en">

    <meta property="og:title" content="OjageCocoa – Family-Owned Full-Spectrum Cocoa Solutions" />

      property="og:description"
      content="OjageCocoa, part of the Ojage family legacy, buys, sells, plants, harvests cocoa, and offers cocoa-related products. Visit us at ojage.com for premium quality."

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.ojage.com/" />
    <meta property="og:image" content="https://www.ojage.com/images/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OjageCocoa – Family-Owned Full-Spectrum Cocoa Solutions" />

      name="twitter:description"

    <script type="application/ld+json">

        "name": "OjageCocoa",

          "email": "support@ojage.com"
        }
      }
    </script>
  </head>
